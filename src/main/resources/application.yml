server:
  port: 8080

spring:
  application:
    name: banking-api
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:mysql://localhost:3306/banking_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    issuer: banking-api
    expiration-seconds: 7200
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    secret: ${JWT_SECRET:c2VjdXJlLWJhbmtpbmctYXBpLXNlY3JldC1rZXktMjAyNA==}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
