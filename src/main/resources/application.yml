server:
  port: 8080

spring:
  application:
    name: banking-api
  datasource:
    url: jdbc:mysql://localhost:3306/banking_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    issuer: banking-api
    expiration-seconds: 7200
    secret: ${JWT_SECRET:c2VjdXJlLWJhbmtpbmctYXBpLXNlY3JldC1rZXktMjAyNA==}
